services:
  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant-storage:/qdrant/storage
    restart: unless-stopped

  chat:
    build:
      context: .
      dockerfile: docker/llama.Dockerfile
    image: cosmecitobot-llama:local
    environment:
      MODE: web
      LLAMA_SERVER: /app/llama-server
      HOST: 0.0.0.0
      PORT: "8080"
      MODEL_PATH: /models/${CHAT_MODEL_FILE:-qwen2.5-1.5b-instruct-q4_k_m.gguf}
      MODEL_URL: ${CHAT_MODEL_URL:-https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf?download=true}
      CONTEXT_SIZE: ${LLAMA_CPP_CONTEXT_TOKENS:-8192}
      GPU_LAYERS: ${CHAT_GPU_LAYERS:-0}
    volumes:
      - llama-models:/models
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10m
    restart: unless-stopped

  embeddings:
    image: cosmecitobot-llama:local
    depends_on:
      chat:
        condition: service_started
    environment:
      MODE: embeddings
      LLAMA_SERVER: /app/llama-server
      EMBEDDING_HOST: 0.0.0.0
      EMBEDDING_PORT: "8081"
      EMBEDDING_MODEL_PATH: /models/${EMBEDDING_MODEL_FILE:-qwen3-embedding-4b-q4_k_m.gguf}
      EMBEDDING_MODEL_URL: ${EMBEDDING_MODEL_URL:-https://huggingface.co/enacimie/Qwen3-Embedding-4B-Q4_K_M-GGUF/resolve/main/qwen3-embedding-4b-q4_k_m.gguf?download=true}
      EMBEDDING_CONTEXT_SIZE: ${EMBEDDING_CONTEXT_SIZE:-2048}
      EMBEDDING_GPU_LAYERS: ${EMBEDDING_GPU_LAYERS:-0}
    volumes:
      - llama-models:/models
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10m
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    env_file:
      - ${BOT_ENV_FILE:-.env}
    environment:
      QDRANT_URL: http://qdrant:6333
      RAG_EMBEDDING_BASE_URL: http://embeddings:8081/v1
    depends_on:
      qdrant:
        condition: service_started
      embeddings:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "${UI_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    env_file:
      - ${BOT_ENV_FILE:-.env}
    environment:
      LLAMA_CPP_BASE_URL: http://chat:8080/v1
      LLAMA_CPP_MODEL: ${CHAT_MODEL_FILE:-qwen2.5-1.5b-instruct-q4_k_m.gguf}
      RAG_EMBEDDING_BASE_URL: http://embeddings:8081/v1
      CHAT_DATABASE_PATH: /app/state/chat_history.sqlite3
      QDRANT_URL: http://qdrant:6333
    volumes:
      - bot-state:/app/state
    depends_on:
      chat:
        condition: service_healthy
      embeddings:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped

volumes:
  llama-models:
  bot-state:
  qdrant-storage:
