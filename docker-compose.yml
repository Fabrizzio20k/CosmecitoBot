services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cosmecito
      POSTGRES_PASSWORD: cosmecito_internal_only
      POSTGRES_DB: cosmecito
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrations:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://cosmecito:cosmecito_internal_only@postgres:5432/cosmecito
      LEGACY_CHAT_DATABASE_PATH: /legacy-state/chat_history.sqlite3
    command: ["sh", "-c", "alembic upgrade head && python -m cosmecito_db.import_legacy_chat"]
    volumes:
      - bot-state:/legacy-state:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant-storage:/qdrant/storage
    restart: unless-stopped

  chat:
    build:
      context: .
      dockerfile: docker/llama.Dockerfile
    image: cosmecitobot-llama:local
    environment:
      MODE: web
      LLAMA_SERVER: /app/llama-server
      HOST: 0.0.0.0
      PORT: "8080"
      MODEL_PATH: /models/${CHAT_MODEL_FILE:-qwen2.5-1.5b-instruct-q4_k_m.gguf}
      MODEL_URL: ${CHAT_MODEL_URL:-https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf?download=true}
      CONTEXT_SIZE: ${LLAMA_CPP_CONTEXT_TOKENS:-8192}
      GPU_LAYERS: ${CHAT_GPU_LAYERS:-0}
    volumes:
      - llama-models:/models
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10m
    restart: unless-stopped

  embeddings:
    image: cosmecitobot-llama:local
    depends_on:
      chat:
        condition: service_started
    environment:
      MODE: embeddings
      LLAMA_SERVER: /app/llama-server
      EMBEDDING_HOST: 0.0.0.0
      EMBEDDING_PORT: "8081"
      EMBEDDING_MODEL_PATH: /models/${EMBEDDING_MODEL_FILE:-qwen3-embedding-4b-q4_k_m.gguf}
      EMBEDDING_MODEL_URL: ${EMBEDDING_MODEL_URL:-https://huggingface.co/enacimie/Qwen3-Embedding-4B-Q4_K_M-GGUF/resolve/main/qwen3-embedding-4b-q4_k_m.gguf?download=true}
      EMBEDDING_CONTEXT_SIZE: ${EMBEDDING_CONTEXT_SIZE:-2048}
      EMBEDDING_GPU_LAYERS: ${EMBEDDING_GPU_LAYERS:-0}
    volumes:
      - llama-models:/models
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10m
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file:
      - ${BOT_ENV_FILE:-.env}
    environment:
      QDRANT_URL: http://qdrant:6333
      RAG_EMBEDDING_BASE_URL: http://embeddings:8081/v1
      DATABASE_URL: postgresql+asyncpg://cosmecito:cosmecito_internal_only@postgres:5432/cosmecito
    depends_on:
      qdrant:
        condition: service_started
      embeddings:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8000
      API_ADMIN_TOKEN: ${API_ADMIN_TOKEN}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    networks:
      - default
      - proxy_net
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    env_file:
      - ${BOT_ENV_FILE:-.env}
    environment:
      LLAMA_CPP_BASE_URL: http://chat:8080/v1
      LLAMA_CPP_MODEL: ${CHAT_MODEL_FILE:-qwen2.5-1.5b-instruct-q4_k_m.gguf}
      RAG_EMBEDDING_BASE_URL: http://embeddings:8081/v1
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: postgresql+asyncpg://cosmecito:cosmecito_internal_only@postgres:5432/cosmecito
    depends_on:
      chat:
        condition: service_healthy
      embeddings:
        condition: service_healthy
      qdrant:
        condition: service_started
      migrations:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  llama-models:
  bot-state:
  postgres-data:
  qdrant-storage:

networks:
  proxy_net:
    external: true
